services:
  app:
    build: .
    container_name: cards-game
    ports:
      - "8550:8550"
    volumes:
      - ./storage:/app/storage
      - ./assets:/app/assets
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8550').close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

